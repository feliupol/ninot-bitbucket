[package]
name = "ninot-bitbucket-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ninot_bitbucket"
crate-type = ["cdylib"]

[dependencies]
ninot-bitbucket = { path = ".." }
ninot-common = { version = "2026.45.2", features = ["state"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
